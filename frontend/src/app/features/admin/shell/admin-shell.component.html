<div class="min-h-screen bg-aegis-bg">
  <!-- Topbar: solo visible antes de lg, donde el sidebar se oculta como drawer. -->
  <header class="sticky top-0 z-30 flex items-center justify-between border-b border-aegis-border bg-aegis-surface px-4 py-3 lg:hidden">
    <app-logo [small]="true"></app-logo>
    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-aegis-dim transition hover:bg-aegis-surface2 hover:text-aegis-text"
      (click)="sidebarOpen = true"
      aria-label="Abrir menú"
    >
      <svg viewBox="0 0 20 20" fill="none" class="h-5 w-5"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>

  @if (sidebarOpen) {
    <div class="fixed inset-0 z-40 bg-black/30 lg:hidden" (click)="sidebarOpen = false"></div>
  }

  <!-- Fixed en todos los tamaños: en mobile queda fuera de pantalla vía translate, en desktop se queda pinneado mientras el contenido de la derecha scrollea. -->
  <aside
    class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col overflow-hidden px-4 py-6 shadow-xl transition-transform duration-200 ease-out lg:w-64 lg:!translate-x-0"
    style="background: linear-gradient(165deg, #0e5fa8 0%, #0a4879 100%)"
    [class.translate-x-0]="sidebarOpen"
    [class.-translate-x-full]="!sidebarOpen"
  >
    <app-gradient-waves></app-gradient-waves>

    <div class="relative z-10 mb-8 flex items-center justify-between px-2">
      <div>
        <app-logo [light]="true"></app-logo>
        <p class="mt-1 pl-[30px] font-display text-[10px] uppercase tracking-[0.14em] text-white/50">Consola admin</p>
      </div>
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-white/60 transition hover:bg-white/10 hover:text-white lg:hidden"
        (click)="sidebarOpen = false"
        aria-label="Cerrar menú"
      >
        <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="relative z-10 flex flex-1 flex-col gap-1">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-white/12 text-white border-white/15"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="sidebarOpen = false"
          class="flex items-center gap-3 rounded-lg border border-transparent px-3 py-2.5 text-sm text-white/65 transition-colors hover:text-white"
        >
          <span class="flex h-5 w-5 items-center justify-center text-aegis-highlight">
            @switch (item.icon) {
              @case ('building') {
                <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><rect x="4" y="2" width="12" height="16" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M7 6h1M12 6h1M7 9h1M12 9h1M7 12h1M12 12h1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              }
              @case ('users') {
                <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><circle cx="7" cy="7" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 16c.5-3 2.2-4.5 4.5-4.5s4 1.5 4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="14" cy="7.5" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M12.5 11.5c1.8.2 3 1.5 3.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              }
              @case ('shield') {
                <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><path d="M10 2l6 2.2v4.6c0 4-2.6 6.6-6 8-3.4-1.4-6-4-6-8V4.2L10 2z" stroke="currentColor" stroke-width="1.4"/></svg>
              }
              @case ('chart') {
                <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><path d="M3 17V9M9 17V3M15 17v-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              }
              @case ('bulb') {
                <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><path d="M10 2.5a5.5 5.5 0 0 0-3 10.1c.4.3.6.7.6 1.2v.7h4.8v-.7c0-.5.2-.9.6-1.2A5.5 5.5 0 0 0 10 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8.2 17h3.6M8.7 14.5h2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              }
              @case ('radar') {
                <svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.3"/><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M10 10L15.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="10" r=".9" fill="currentColor"/></svg>
              }
            }
          </span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="relative z-10 mt-auto rounded-lg border border-white/10 bg-white/5 px-3 py-3">
      <p class="font-display text-[10px] uppercase tracking-wide text-white/50">Empresa</p>
      <p class="mt-1 truncate text-sm text-white">Vertice Consulting</p>
    </div>
  </aside>

  <div class="flex min-h-screen flex-col overflow-x-hidden lg:pl-64">
    <router-outlet></router-outlet>
  </div>
</div>
