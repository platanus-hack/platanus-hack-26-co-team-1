# Blueprint de Aegis. Un solo servicio sirve el front y el API.
#
# Van juntos a proposito: separados hacen falta dos servicios, una URL para cada
# uno y CORS en el medio, y todo eso para que dos piezas del mismo producto se
# hablen. El sitio estatico que hubo un rato quedo obsoleto en cuanto el panel
# paso a mostrar datos de verdad, porque para eso necesita el API al lado.
services:
  - type: web
    name: aegis-panel
    runtime: python
    plan: free
    branch: main
    # Node esta disponible en el runtime de Python de Render, asi que el front
    # se compila aca mismo y el servicio sirve el resultado desde disco.
    #
    # npm install y no npm ci: el package-lock.json quedo desincronizado con el
    # package.json (le faltan @emnapi/core y @emnapi/runtime) y `npm ci` se
    # niega a instalar. Cuando el lock se actualice, esto deberia volver a
    # `npm ci`, que es lo unico que da builds reproducibles.
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: python web/app.py
    # Render reinicia el servicio si esta ruta deja de responder. Es barata: no
    # toca el almacen mas alla de contar lo que ya esta cargado.
    healthCheckPath: /v1/health
    envVars:
      - key: AEGIS_TENANT
        value: acme
      # Con un plan de pago se monta un disco y se apunta AEGIS_DATA_DIR ahi
      # para que los eventos sobrevivan a los reinicios. En el plan gratuito no
      # hay discos, y el servicio degrada a memoria a proposito.
